services:
  postgres:
    image: postgres:16-alpine
    container_name: pocketguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pocketguide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pocketguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pocket-guide-backend
      dockerfile: Dockerfile
    container_name: pocketguide-backend
    restart: unless-stopped
    env_file:
      - ./pocket-guide-backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pocketguide?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
