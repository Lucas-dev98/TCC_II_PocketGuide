<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Compass rose gradient -->
    <linearGradient id="compassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- North pointer gradient (red) -->
    <linearGradient id="northGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#bgGradient)"/>
  
  <!-- Outer ring (compass border) -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <circle cx="128" cy="128" r="88" fill="url(#compassGradient)" opacity="0.15"/>
  
  <!-- Inner compass circle -->
  <circle cx="128" cy="128" r="80" fill="white" opacity="0.95"/>
  
  <!-- Compass degree markers -->
  <g stroke="white" stroke-width="1" opacity="0.4">
    <!-- Major markers (every 45°) -->
    <line x1="128" y1="50" x2="128" y2="58"/>
    <line x1="128" y1="198" x2="128" y2="206"/>
    <line x1="206" y1="128" x2="198" y2="128"/>
    <line x1="50" y1="128" x2="58" y2="128"/>
    
    <!-- Diagonal markers -->
    <line x1="164.7" y1="63.3" x2="160" y2="69.6"/>
    <line x1="192.7" y1="63.3" x2="186.4" y2="69.6"/>
    <line x1="192.7" y1="192.7" x2="186.4" y2="186.4"/>
    <line x1="164.7" y1="192.7" x2="160" y2="186.4"/>
  </g>
  
  <!-- Direction labels -->
  <text x="128" y="70" font-size="14" font-weight="bold" fill="#EF4444" text-anchor="middle" font-family="Arial, sans-serif">N</text>
  <text x="128" y="192" font-size="12" fill="#666" text-anchor="middle" font-family="Arial, sans-serif">S</text>
  <text x="192" y="133" font-size="12" fill="#666" text-anchor="middle" font-family="Arial, sans-serif">E</text>
  <text x="64" y="133" font-size="12" fill="#666" text-anchor="middle" font-family="Arial, sans-serif">W</text>
  
  <!-- Main compass rose with cardinal directions -->
  
  <!-- North arrow (red) - Main pointer -->
  <g fill="url(#northGradient)" opacity="0.9">
    <polygon points="128,60 135,85 128,80 121,85"/>
    <path d="M 128 60 Q 132 72 133 85 Q 128 80 123 85 Q 124 72 128 60" fill="url(#northGradient)"/>
  </g>
  
  <!-- South pointer (lighter) -->
  <g fill="#999" opacity="0.4">
    <polygon points="128,196 135,171 128,176 121,171"/>
  </g>
  
  <!-- East pointer (lighter) -->
  <g fill="#999" opacity="0.3">
    <polygon points="196,128 171,135 176,128 171,121"/>
  </g>
  
  <!-- West pointer (lighter) -->
  <g fill="#999" opacity="0.3">
    <polygon points="60,128 85,135 80,128 85,121"/>
  </g>
  
  <!-- Decorative cardinal star points -->
  <!-- NE Star -->
  <polygon points="174,74 176,78 180,80 176,82 174,86 172,82 168,80 172,78" fill="white" opacity="0.6"/>
  
  <!-- SE Star -->
  <polygon points="182,182 184,186 188,188 184,190 182,194 180,190 176,188 180,186" fill="white" opacity="0.5"/>
  
  <!-- SW Star -->
  <polygon points="74,182 76,186 80,188 76,190 74,194 72,190 68,188 72,186" fill="white" opacity="0.5"/>
  
  <!-- NW Star -->
  <polygon points="74,74 76,78 80,80 76,82 74,86 72,82 68,80 72,78" fill="white" opacity="0.6"/>
  
  <!-- Center circle (compass pivot) -->
  <circle cx="128" cy="128" r="8" fill="#3B82F6" stroke="white" stroke-width="2"/>
  <circle cx="128" cy="128" r="4" fill="white" opacity="0.8"/>
  
  <!-- Subtle outer glow -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
</svg>