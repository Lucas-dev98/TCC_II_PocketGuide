name: Deploy React Web

on:
  push:
    branches: [main]
    paths:
      - 'pocket-guide-web/**'
      - '.github/workflows/deploy.yml'

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd pocket-guide-web && npm ci

      - name: Type check
        run: cd pocket-guide-web && npx tsc --noEmit

      - name: Build
        run: cd pocket-guide-web && npm run build

      - name: Verify build output
        run: |
          if [ ! -d "pocket-guide-web/dist" ]; then
            echo "❌ Build failed: dist folder not created"
            exit 1
          fi
          echo "✅ Build verified successfully"

  deploy-to-vercel:
    runs-on: ubuntu-latest
    needs: test-and-verify
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@v4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./pocket-guide-web
          production: true

      - name: Success notification
        if: success()
        run: echo "✅ Deployment to Vercel successful!"

      - name: Failure notification
        if: failure()
        run: echo "❌ Deployment failed. Check Vercel logs for details."
